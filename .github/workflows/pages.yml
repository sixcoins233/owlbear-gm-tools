name: Deploy Owlbear extensions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Assemble static site
        run: |
          mkdir -p site/normal-d20 site/quest-board site/destiny-dice site/bilibili-music
          cp -r normal-d20/dist/. site/normal-d20/
          cp -r quest-board/dist/. site/quest-board/
          cp -r destiny-dice/dist/. site/destiny-dice/
          cp -r bilibili-music/dist/. site/bilibili-music/
          cp site-index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
